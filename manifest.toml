#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "phpservermon"
name = "PHP Server Monitor"
description.en = "Script that checks whether your websites and servers are up and running"
description.fr = "Application pour vérifier que vos sites web et serveurs fonctionnent"

version = "3.5.2~ynh7"

maintainers = ["Benoit"]

[upstream]
license = "GPL-3.0-or-later"
website = "https://www.phpservermonitor.org/"
admindoc = "https://docs.phpservermonitor.org/en/latest/"
code = "https://github.com/phpservermon/phpservermon/"
fund = "https://github.com/sponsors/TimZ99"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/phpservermon"

    [install.init_main_permission]
    help.en = "If the app is not public, only YunoHost users will have access to it"
    help.fr = "Si l'application n'est pas publique, seul les utilisateurs de YunoHost y auront accés"
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/phpservermon/phpservermon/archive/2f49271538e187d63c5cc97f7dfc937f935f9c62.tar.gz"
    sha256 = "50fcf8c8d6bfc515cd800aaf3331b59aa92d01f3ed60589f9417e63f38f74652"
    in_subdir = 2 # Yes, 2 levels

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "tarball"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "php8.2-curl",
        "php8.2-common",
        "php8.2-json",
        "php8.2-xml",
        "mariadb-server"
    ]

    [resources.database]
    type = "mysql"
